# ============================================================
# 🚀 The Arc Vault — Enhanced CI/CD Pipeline
# ============================================================
# GATES:
#   1. Lint        → ESLint checks code quality
#   2. Audit       → npm audit checks for vulnerable packages
#   3. Secrets     → Gitleaks scans for exposed credentials
#   4. Test        → Vitest runs unit tests
#   5. Build+Scan+Push → build image locally, Trivy scan, push to Docker Hub
#   6. Deploy      → Watchtower auto-detects (no action needed)
# ============================================================

name: 🚀 The Arc Vault CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:              # Also run checks on PRs (but DON'T push image)
    branches: [main]
  workflow_dispatch:

# Least privilege: jobs only read the repo. Actions are pinned to commit SHAs
# because tags are mutable and a retagged action would run with this token.
permissions:
  contents: read

jobs:
  # ================================================================
  # JOB 1: CODE QUALITY — Lint with ESLint
  # ================================================================
  lint:
    name: 🔍 Code Quality (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'         # Match your Dockerfile: node:24-slim
          cache: 'npm'               # Cache node_modules between runs

      - name: 📦 Install dependencies
        run: npm ci                  # Clean install from lockfile

      - name: 🔍 Run ESLint
        run: npm run lint            # Runs: eslint . (from your package.json)

  # ================================================================
  # JOB 2: DEPENDENCY AUDIT — Check for vulnerable packages
  # ================================================================
  audit:
    name: 📦 Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run npm audit
        run: npm audit --audit-level=high --omit=dev

  # ================================================================
  # JOB 3: SECRET SCANNING — Detect exposed credentials
  # ================================================================
  secrets-scan:
    name: 🔐 Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read    # gitleaks-action lists PR commits via the API
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0             # Fetch full git history so Gitleaks
                                      # can scan ALL commits, not just latest

      - name: 🔐 Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    # Auto-provided by GitHub

  # ================================================================
  # JOB 4: TESTS — Run unit tests
  # ================================================================
  test:
    name: 🧪 Run Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test

  # ================================================================
  # JOB 5: BUILD & PUSH — Docker image to Docker Hub
  # ================================================================
  build-and-push:
    name: 🐳 Build & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [lint, audit, secrets-scan, test]    # ← The pipeline FAILS if any gate fails

    # Only push on main branch (not on pull requests)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read             # checkout
      security-events: write     # upload Trivy SARIF to code scanning

    env:
      IMAGE: pokharelsandeep333/molecular-zettelkasten
      # Trivy v0.76.1, pinned by digest. Run as a plain container: do NOT switch to
      # aquasecurity/trivy-action or setup-trivy (tags hijacked in the March 2026 attack).
      TRIVY_IMAGE: aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
      # REPORT-ONLY: findings go to the log and the Security tab, the push still happens.
      # To BLOCK the push on fixable CRITICAL/HIGH findings, change "0" to "1".
      TRIVY_EXIT_CODE: "0"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build once into the local Docker daemon so it can be scanned before anything
      # is pushed. The push step below reuses this builder's layer cache, so it pushes
      # the same layers that were scanned.
      - name: 🐳 Build Docker Image (local, for scanning)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Anchored so the push step below uses exactly the same build args.
          build-args: &build-args |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📅 Trivy DB cache key
        id: trivy-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # One cache entry per day; older entries are restored as a fallback and Trivy
      # refreshes them only if they are stale.
      - name: 💾 Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache/db
          key: trivy-db-${{ steps.trivy-date.outputs.date }}
          restore-keys: trivy-db-

      # Everything Trivy touches lives in $RUNNER_TEMP, never in the checkout: an
      # image.tar in the workspace would end up in the push step's build context.
      # Runs as the runner user so the cached DB stays readable by actions/cache.
      # No Docker socket is mounted; Trivy only reads the saved tar.
      - name: 🛡️ Trivy scan (SARIF)
        run: |
          mkdir -p "$RUNNER_TEMP/trivy" "$RUNNER_TEMP/trivy-cache"
          docker save "$IMAGE:$GITHUB_SHA" -o "$RUNNER_TEMP/trivy/image.tar"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/trivy:/w" -v "$RUNNER_TEMP/trivy-cache:/cache" \
            "$TRIVY_IMAGE" image --cache-dir /cache --skip-version-check --timeout 15m \
            --scanners vuln --input /w/image.tar \
            --severity CRITICAL,HIGH --ignore-unfixed \
            --exit-code 0 --format sarif --output /w/trivy.sarif

      - name: 📤 Upload Trivy SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/trivy/trivy.sarif
          category: trivy-image-build

      # Human-readable report. This is the gate: it fails the job (and skips the
      # push) only when TRIVY_EXIT_CODE is "1" and fixable findings exist.
      - name: 🛡️ Trivy report (table)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/trivy:/w" -v "$RUNNER_TEMP/trivy-cache:/cache" \
            "$TRIVY_IMAGE" image --cache-dir /cache --skip-version-check --timeout 15m --skip-db-update \
            --scanners vuln --input /w/image.tar \
            --severity CRITICAL,HIGH --ignore-unfixed \
            --exit-code "$TRIVY_EXIT_CODE" --format table

      - name: 🐳 Push Docker Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            pokharelsandeep333/molecular-zettelkasten:latest
            pokharelsandeep333/molecular-zettelkasten:${{ github.sha }}
          build-args: *build-args
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📋 Deployment Summary
        run: |
          echo "============================================="
          echo "✅ All quality gates passed!"
          echo "✅ Image pushed to Docker Hub!"
          echo "   Image: pokharelsandeep333/molecular-zettelkasten:latest"
          echo "   Commit: ${{ github.sha }}"
          echo ""
          echo "⏳ Watchtower will auto-deploy within ~5 minutes"
          echo "   Container: arc-vault"
          echo "============================================="
